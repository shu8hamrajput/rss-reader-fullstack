name: rss-reader-stack

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rss_reader
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI (guest/guest)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - cluster.name=rss-reader
      - node.name=es01
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - ./rss_reader_backend/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: ./rss_reader_backend
    ports:
      - "8080:8080"
    env_file:
      - path: ./rss_reader_backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/rss_reader
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    develop:
      watch:
        # Plain uvicorn (no --reload), so sync code then restart the container.
        - action: sync+restart
          path: ./rss_reader_backend/app
          target: /app/app
        - action: rebuild
          path: ./rss_reader_backend/requirements.txt
        - action: rebuild
          path: ./rss_reader_backend/Dockerfile

  celery-worker:
    build: ./rss_reader_backend
    command: celery -A app.celery_app worker --loglevel=info
    develop:
      watch:
        - action: sync+restart
          path: ./rss_reader_backend/app
          target: /app/app
        - action: rebuild
          path: ./rss_reader_backend/requirements.txt
        - action: rebuild
          path: ./rss_reader_backend/Dockerfile
    env_file:
      - path: ./rss_reader_backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/rss_reader
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  celery-beat:
    build: ./rss_reader_backend
    command: celery -A app.celery_app beat --loglevel=info
    develop:
      watch:
        - action: sync+restart
          path: ./rss_reader_backend/app
          target: /app/app
        - action: rebuild
          path: ./rss_reader_backend/requirements.txt
        - action: rebuild
          path: ./rss_reader_backend/Dockerfile
    env_file:
      - path: ./rss_reader_backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/rss_reader
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ui:
    build:
      context: ./rss_reader_ui
      target: dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8080
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./rss_reader_ui:/app
      - ui_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_started
    stdin_open: true
    tty: true
    develop:
      watch:
        # Source is already bind-mounted with Vite HMR — only rebuild when
        # dependencies or the image itself change.
        - action: rebuild
          path: ./rss_reader_ui/package.json
        - action: rebuild
          path: ./rss_reader_ui/package-lock.json
        - action: rebuild
          path: ./rss_reader_ui/Dockerfile

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  ui_node_modules:
  es_data:
